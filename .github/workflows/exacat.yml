name: Exakat Security Scan (SARIF + JSON)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  exakat:
    name: Run Exakat scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Download and install Exakat
        run: |
          curl -O -J 'https://www.exakat.io/versions/index.php?file=latest'
          mv exakat-*.phar exakat.phar
          php exakat.phar install -v

      - name: Run Exakat - generate SARIF and JSON reports
        run: |
          php exakat.phar project:scan -p ./ --report=sarif,json --output=exakat-output

      - name: Upload SARIF report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: exakat-output/report.sarif

      - name: Upload JSON report as artifact
        uses: actions/upload-artifact@v2
        with:
          name: exakat-json-report
          path: exakat-output/report.json
