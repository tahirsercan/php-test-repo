name: Combined SAST Pipeline

on:
  push:
    branches: [ "main", "develop", "next" ]
  pull_request:
    branches: [ "main", "develop", "next" ]

jobs:
  sast_scan:
    name: Run Combined SAST Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # --- Horusec Scan Steps ---
    - name: Install Horusec
      run: |
        curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash -s latest

    - name: Run Horusec Scan (Generate JSON & SARIF)
      id: horusec_scan
      # This step will 'continue-on-error' if Horusec itself exits with a non-zero code
      continue-on-error: true
      run: |
        echo "Running Horusec scan for JSON output..."
        horusec start -p="./" \
          --output-format="json" \
          --json-output-file="horusec_report.json" \
          --ignore-severity="LOW,MEDIUM" \
          --ignore="**/vendor/**,**/node_modules/**" \
          --return-error=false \
          --disable-docker

        echo "Running Horusec scan for SARIF output..."
        # FIX: Ensure --sarif-output-file is used for SARIF output.
        # This was the crucial fix from the previous round that might not have landed correctly.
        horusec start -p="./" \
          --output-format="sarif" \
          --sarif-output-file="horusec_report.sarif" \ # THIS LINE IS CRITICAL
          --ignore-severity="LOW,MEDIUM" \
          --ignore="**/vendor/**,**/node_modules/**" \
          --return-error=false \
          --disable-docker
          
        # Check if the Horusec SARIF file was actually created and is not empty.
        # If it's empty or doesn't exist, we'll create a minimal valid SARIF to prevent upload errors.
        if [ ! -s horusec_report.sarif ]; then
          echo "WARNING: horusec_report.sarif is empty or not created correctly by Horusec. Creating a minimal valid SARIF for upload."
          # Create a truly empty but valid SARIF file to satisfy the upload action
          echo '{"$schema":"https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0-rtm.5.json","version":"2.1.0","runs":[]}' > horusec_report.sarif
        else
          echo "horusec_report.sarif seems to be generated successfully."
        fi

    # --- Semgrep Scan Steps ---
    - name: Install Semgrep
      run: |
          python -m pip install semgrep
          semgrep --version

    - name: Run Semgrep Scan (SARIF Output)
      id: semgrep_sarif_scan
      # Continue on error so other steps (like JSON output, artifact upload) still run.
      continue-on-error: true
      run: |
          echo "Running Semgrep scan for SARIF output..."
          # Added --verbose for more debugging info on the 'config error'
          semgrep --config=p/php --config=p/owasp-top10 --sarif --output=semgrep-results.sarif --verbose .
          
          if [ ! -s semgrep-results.sarif ]; then
            echo "WARNING: semgrep-results.sarif is empty or not created. Creating an empty valid SARIF."
            echo '{"$schema":"https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0-rtm.5.json","version":"2.1.0","runs":[]}' > semgrep-results.sarif
          else
            echo "semgrep-results.sarif seems to be generated successfully."
          fi

    - name: Run Semgrep Scan (JSON Output)
      id: semgrep_json_scan
      continue-on-error: true
      run: |
          echo "Running Semgrep scan for JSON output..."
          semgrep --config=p/php --config=p/owasp-top10 --json --output=semgrep-results.json --verbose .
          
          if [ ! -s semgrep-results.json ]; then
            echo "WARNING: semgrep-results.json is empty or not created. Creating an empty JSON object."
            echo '{}' > semgrep-results.json
          else
            echo "semgrep-results.json seems to be generated successfully."
          fi

    # --- Upload SARIF Results to GitHub Code Scanning ---
    - name: Upload Horusec SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: horusec_report.sarif
        # Removed 'if-no-files-found' as it's not supported by v3.
        # The preceding 'if [ ! -s ... ]' check will ensure a valid (empty) SARIF is present.
      if: always()

    - name: Upload Semgrep SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: semgrep-results.sarif
        # Removed 'if-no-files-found' as it's not supported by v3.
      if: always()

    # --- Upload All Reports as Artifacts ---
    - name: Upload All Security Reports as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: combined-security-reports
        path: |
          horusec_report.json
          horusec_report.sarif
          semgrep-results.json
          semgrep-results.sarif
      if: always()
