name: Combined SAST Pipeline

on:
  push:
    branches: [ "main", "develop", "next" ]
  pull_request:
    branches: [ "main", "develop", "next" ]

jobs:
  sast_scan:
    name: Run Combined SAST Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for GitHub Code Scanning
      contents: read       # Required for checking out code
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # --- Horusec Scan Steps ---
    - name: Install Horusec
      run: |
        curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash -s latest

    - name: Run Horusec Scan (Generate JSON & SARIF for Secrets/Config)
      # Using 'continue-on-error: true' here ensures the workflow doesn't stop
      # if Horusec itself has an issue generating reports, allowing other steps to run.
      # '--return-error=false' in horusec command also helps with this.
      continue-on-error: true
      run: |
        echo "Running Horusec scan for JSON output..."
        horusec start -p="./" \
          --output-format="json" \
          --json-output-file="horusec_report.json" \
          --ignore-severity="LOW,MEDIUM" \
          --ignore="**/vendor/**,**/node_modules/**" \
          --return-error=false \
          --disable-docker

        echo "Running Horusec scan for SARIF output..."
        horusec start -p="./" \
          --output-format="sarif" \
          --json-output-file="horusec_report.sarif" \ # This should be --sarif-output-file
          --ignore-severity="LOW,MEDIUM" \
          --ignore="**/vendor/**,**/node_modules/**" \
          --return-error=false \
          --disable-docker
          
        # Verify if SARIF file was created and is not empty
        if [ ! -s horusec_report.sarif ]; then
          echo "Warning: horusec_report.sarif is empty or not created. This may cause upload issues."
          # Create a dummy valid SARIF to prevent upload-sarif from failing if the file is truly missing/empty
          echo '{"$schema":"https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0-rtm.5.json","version":"2.1.0","runs":[]}' > horusec_report.sarif
        fi

    # --- Semgrep Scan Steps ---
    - name: Install Semgrep
      run: |
          python -m pip install semgrep
          semgrep --version

    - name: Run Semgrep Scan (SARIF Output for Code Vulnerabilities)
      # Using 'continue-on-error: true' here so that if Semgrep can't find rules (exit code 7),
      # the workflow can still continue to the JSON output and artifact upload steps.
      continue-on-error: true
      run: |
          echo "Running Semgrep scan for SARIF output..."
          # Use --verbose for debugging if rules aren't found
          semgrep --config=p/php --config=p/owasp-top10 --sarif --output=semgrep-results.sarif .
          
          # Verify if SARIF file was created and is not empty
          if [ ! -s semgrep-results.sarif ]; then
            echo "Warning: semgrep-results.sarif is empty or not created. This may cause upload issues."
            echo '{"$schema":"https://schemastore.azurewebsites.net/schemas/json/sarif-2.1.0-rtm.5.json","version":"2.1.0","runs":[]}' > semgrep-results.sarif
          fi


    - name: Run Semgrep Scan (JSON Output for Detailed Analysis)
      # This step should also continue on error to ensure artifacts are uploaded
      continue-on-error: true
      run: |
          echo "Running Semgrep scan for JSON output..."
          semgrep --config=p/php --config=p/owasp-top10 --json --output=semgrep-results.json .
          
          # Verify if JSON file was created and is not empty
          if [ ! -s semgrep-results.json ]; then
            echo "Warning: semgrep-results.json is empty or not created."
            echo '{}' > semgrep-results.json # Create an empty JSON object
          fi

    # --- Upload SARIF Results to GitHub Code Scanning ---
    - name: Upload Horusec SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: horusec_report.sarif
        # This will prevent the step from failing if the SARIF file is empty but valid.
        # It's less prone to the "1 item required" error if the file itself is truly empty.
        if-no-files-found: ignore
      if: always()

    - name: Upload Semgrep SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: semgrep-results.sarif
        if-no-files-found: ignore
      if: always()

    # --- Upload All Reports as Artifacts ---
    - name: Upload All Security Reports as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: combined-security-reports
        path: |
          horusec_report.json
          horusec_report.sarif
          semgrep-results.json
          semgrep-results.sarif
      if: always()
