name: Combined SAST Pipeline

on:
  push:
    branches: [ "main", "develop", "dev" ]
  pull_request:
    branches: [ "main", "develop", "dev" ]

jobs:
  sast_scan:
    name: Run Combined SAST Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write # For GitHub Code Scanning
      contents: read       # For checking out code
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # --- Horusec Scan Steps ---
    - name: Install Horusec
      run: |
        curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh | bash -s latest

    - name: Run Horusec Scan (JSON & SARIF for Secrets/Config)
      id: horusec_scan
      run: |
        # Generate JSON report, disabling Docker
        horusec start -p="./" \
          --output-format="json" \
          --json-output-file="horusec_report.json" \
          --ignore-severity="LOW,MEDIUM" \
          --ignore="**/vendor/**,**/node_modules/**" \
          --return-error=false \
          --disable-docker

        # Generate SARIF report, disabling Docker
        horusec start -p="./" \
          --output-format="sarif" \
          --json-output-file="horusec_report.sarif" \
          --ignore-severity="LOW,MEDIUM" \
          --ignore="**/vendor/**,**/node_modules/**" \
          --return-error=false \
          --disable-docker

    # --- Semgrep Scan Steps ---
    - name: Install Semgrep
      run: |
          python -m pip install semgrep
          semgrep --version

    - name: Run Semgrep Scan (SARIF Output for Code Vulnerabilities)
      id: semgrep_sarif_scan
      run: |
          # Tarama kapsamını buraya ekleyebilirsiniz, örn. sadece özel PHP kodunuz
          # semgrep --config=p/php --sarif --output=semgrep-results.sarif path/to/your/custom/php/code/
          semgrep --config=p/php --config=p/owasp-top10 --sarif --output=semgrep-results.sarif .

    - name: Run Semgrep Scan (JSON Output for Detailed Analysis)
      id: semgrep_json_scan
      run: |
          # Tarama kapsamını buraya ekleyebilirsiniz, örn. sadece özel PHP kodunuz
          # semgrep --config=p/php --json --output=semgrep-results.json path/to/your/custom/php/code/
          semgrep --config=p/php --config=p/owasp-top10 --json --output=semgrep-results.json .

    # --- Upload SARIF Results to GitHub Code Scanning ---
    - name: Upload Horusec SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: horusec_report.sarif
      if: always() # Ensure this step runs even if the scan had an error

    - name: Upload Semgrep SARIF to GitHub Code Scanning
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: semgrep-results.sarif
      if: always() # Ensure this step runs even if the scan had an error

    # --- Upload All Reports as Artifacts ---
    - name: Upload All Security Reports as Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: combined-security-reports
        path: |
          horusec_report.json
          horusec_report.sarif
          semgrep-results.json
          semgrep-results.sarif
      if: always()
